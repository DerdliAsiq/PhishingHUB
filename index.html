        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 6px; box-sizing: border-box; background: #1e1e2f; color: #fff; font-size: 16px; outline: none; }
        input[type="text"]:focus { border: 1px solid #4CAF50; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #45a049; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; word-wrap: break-word; line-height: 1.5; }
        .loading { background-color: #d35400; }
        .success { background-color: #27ae60; }
        .danger { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚨 Phishing Analiz Merkezi</h2>
        <p>Şüpheli bir bağlantıya tıkladıktan sonra, URL'yi analiz etmek için aşağıya girin:</p>
        <input type="text" id="urlInput" placeholder="https://süpheli-link.com/aciliyet_fatura.exe">
        <button onclick="analyzeUrl()">Analiz Et</button>
        
        <div id="result"></div>
    </div>

    <script>
        // ÖNEMLİ: Render.com'a deploy ettiğinde burayı kendi public URL'in ile değiştir
        // Örnek: "https://senin-projen.onrender.com/analyze/url"
        const API_ENDPOINT = "http://localhost:8000/analyze/url"; 

        async function analyzeUrl() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            
            if(!url) {
                alert("Hedef yok! Lütfen bir URL girin.");
                return;
            }

            resultDiv.style.display = "block";
            resultDiv.className = "loading";
            resultDiv.innerHTML = "⏳ İstihbarat API'leri sorgulanıyor, bekleyin...";

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if(response.ok) {
                    resultDiv.className = "success";
                    resultDiv.innerHTML = `
                        <strong>Durum:</strong> ${data.message} <br>
                        <strong>Taranan URL:</strong> ${data.url_scanned} <br>
                        <strong>Aksiyon:</strong> ${data.action} <br>
                        <strong>VT ID:</strong> <small>${data.vt_analysis_id}</small>
                    `;
                } else {
                    resultDiv.className = "danger";
                    resultDiv.innerHTML = `🔥 Kritik Hata: ${data.detail}`;
                }
            } catch (error) {
                resultDiv.className = "danger";
                resultDiv.innerHTML = "❌ Sunucuya ulaşılamadı. Uvicorn veya Render ayakta mı?";
            }
        }
    </script>
</body>
</html>

        <footer class="site-footer container">
            <div class="footer-brand">
                <svg class="signal-mark" viewBox="0 0 24 24">
                    <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
                <span>PHISHGUARD</span>
            </div>
            <div>Passive Security Workspace</div>
            <div class="footer-code">BUILD: PG-24.57</div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const scanBtn = document.getElementById('scan-btn');
            const urlInput = document.getElementById('target-url');
            const resultBox = document.getElementById('result-box');
            
            // Connect to the actual Render API we built
            const API_ENDPOINT = "https://phishinghub.onrender.com/analyze/url";

            scanBtn.addEventListener('click', async () => {
                const url = urlInput.value.trim();
                
                if (!url) {
                    showFeedback('error', 'Target Required', 'Please enter a URL to scan.');
                    return;
                }
                
                // Show loading state
                scanBtn.disabled = true;
                scanBtn.innerHTML = `
                    ANALYZING...
                    <div class="analyze-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                        </svg>
                    </div>
                `;
                
                showFeedback('info', 'Connecting to Intelligence Hub', 'Submitting URL for deep analysis...');
                
                try {
                    const response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showFeedback('success', 'Scan Initiated Successfully', `
                            <strong>Target:</strong> ${data.url_scanned}<br>
                            <strong>Status:</strong> ${data.message}<br>
                            <strong>Action:</strong> ${data.action}<br>
                            <strong>VT Ref:</strong> <small style="font-family: monospace">${data.vt_analysis_id}</small>
                        `);
                    } else {
                        showFeedback('error', 'Analysis Failed', data.detail || 'The API rejected the request.');
                    }
                } catch (error) {
                    showFeedback('error', 'Connection Error', 'Could not connect to the PhishingHub API. Ensure the backend on Render is running.');
                } finally {
                    scanBtn.disabled = false;
                    scanBtn.innerHTML = `
                        INITIATE SCAN
                        <div class="analyze-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </div>
                    `;
                }
            });
            
            function showFeedback(type, title, message) {
                resultBox.style.display = 'flex';
                resultBox.className = `feedback-box ${type}`;
                
                let icon = '';
                if (type === 'error') {
                    icon = '<path d="M18 6L6 18M6 6l12 12"></path>';
                } else if (type === 'success') {
                    icon = '<polyline points="20 6 9 17 4 12"></polyline>';
                } else {
                    icon = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>';
                }
                
                resultBox.innerHTML = `
                    <div class="feedback-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
                    </div>
                    <div>
                        <strong>${title}</strong>
                        <p>${message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
